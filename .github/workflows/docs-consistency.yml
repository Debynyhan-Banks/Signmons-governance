name: docs-consistency

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-governance-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run docs consistency check
        run: node scripts/docs-consistency-check.mjs

      - name: Test frozen baseline and governance regressions
        run: node --test scripts/frozen-baseline-check.test.mjs scripts/execution-placement.test.mjs scripts/intelligence-alignment-check.test.mjs
